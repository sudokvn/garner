# GoReleaser builds a release's terminal interface for macOS and Linux, on
# ARM and x86, and creates the GitHub release with it. The release workflow
# builds the source archive (tools/source.sh) and the server image first,
# and passes them as SOURCE_ARCHIVE and IMAGE_REF. Try a release without
# publishing anything:
#   bash tools/source.sh v0.0.0 /tmp/garner-source
#   SOURCE_ARCHIVE=/tmp/garner-source/garner-v0.0.0-source.tar.gz goreleaser release --snapshot --clean
version: 2
project_name: garner

builds:
  - id: garner
    main: ./cmd/garner
    binary: garner
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # A release names its source archive, which it publishes with the
    # binaries; a snapshot publishes none, so it names none.
    ldflags:
      - "-s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }}"
      - "{{ if not .IsSnapshot }}-X github.com/sudokvn/garner/internal/buildinfo.sourceURL=https://github.com/sudokvn/garner/releases/download/{{ .Tag }}/garner-{{ .Tag }}-source.tar.gz{{ end }}"
    targets: [darwin_arm64, darwin_amd64_v1, linux_amd64_v1, linux_arm64_v8.0]

# Signs and notarizes the macOS binaries with garner's Developer ID, so
# macOS opens them without a warning. The release workflow sets the Apple
# credentials; without them, as in a snapshot, the binaries stay unsigned.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [garner]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# One archive per platform, the license and notices next to the binary at
# its root; install.sh and the Homebrew casks unpack it.
archives:
  - formats: [tar.gz]
    name_template: "garner-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    files: [LICENSE, NOTICE, THIRD-PARTY-NOTICES.txt]

checksum:
  name_template: SHA256SUMS
  # The source archive is published with the binaries, so its sum is in
  # here too.
  extra_files:
    - glob: "{{ .Env.SOURCE_ARCHIVE }}"

# Homebrew casks in sudokvn/homebrew-tap, one per channel: garner for the
# stable releases, garner@dev for candidates and stable releases alike, so
# brew upgrade keeps each on its channel. Both install the command garner,
# so each conflicts with the other. The release workflow sets the tap's
# deploy key and says whether this is the newest release of each channel;
# otherwise a cask is only written into dist/.
homebrew_casks:
  - name: garner
    binaries: [garner]
    homepage: https://github.com/sudokvn/garner
    description: Terminal interface for garner, a self-hosted TV and anime manager
    license: AGPL-3.0-only
    conflicts:
      - cask: garner@dev
    commit_msg_template: "Update garner to {{ .Tag }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: '{{ if and (isEnvSet "HOMEBREW_TAP_KEY") (eq (envOrDefault "NEWEST_STABLE" "") "true") }}false{{ else }}true{{ end }}'
    repository:
      owner: sudokvn
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:sudokvn/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_KEY" "" }}'
  - name: garner@dev
    binaries: [garner]
    homepage: https://github.com/sudokvn/garner
    description: Terminal interface for garner, a self-hosted TV and anime manager; release candidates and stable releases
    license: AGPL-3.0-only
    conflicts:
      - cask: garner
    commit_msg_template: "Update garner@dev to {{ .Tag }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: '{{ if and (isEnvSet "HOMEBREW_TAP_KEY") (eq (envOrDefault "NEWEST_RELEASE" "") "true") }}false{{ else }}true{{ end }}'
    repository:
      owner: sudokvn
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:sudokvn/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_KEY" "" }}'

# The release workflow passes the notes of tools/release-notes.sh, which
# leave out commits users see nothing of. This list of every commit since
# the previous tag, newest first, stands in when that script fails.
changelog:
  use: git
  format: "{{ .Message }}"

# A candidate, such as v0.9.0-rc.1, is a pre-release on GitHub: the dev
# channel. GitHub's latest release, which install.sh follows by default,
# is the newest stable one. The header names the image, which holds the
# same source as the binaries, and the source archive both are built from.
release:
  prerelease: auto
  make_latest: '{{ envOrDefault "NEWEST_STABLE" "false" }}'
  name_template: "garner {{ .Tag }}"
  header: |
    Server image: `{{ envOrDefault "IMAGE_REF" "not built in this run" }}`

    garner is licensed under the [GNU AGPL version 3 only](https://github.com/sudokvn/garner/blob/{{ .Tag }}/LICENSE); third-party code keeps its own licence, listed in `THIRD-PARTY-NOTICES.txt` in every archive. The corresponding source of these binaries and of the server image's `garnerd` and FFprobe, Turso's native library included, is `garner-{{ .Tag }}-source.tar.gz` below; [docs/source.md](https://github.com/sudokvn/garner/blob/{{ .Tag }}/docs/source.md) describes how to build from it.
  extra_files:
    - glob: "{{ .Env.SOURCE_ARCHIVE }}"
