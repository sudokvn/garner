# Builds a dev build of main once the Check workflow passed on a push to
# main, or when started by hand on main: the source archive, the server
# image from it and, with GoReleaser, the terminal interface for Linux. It
# publishes them without a version tag: the image as
# ghcr.io/sudokvn/garner:VERSION and :dev, the rest in the rolling
# pre-release dev, whose title is the version and whose body names the
# image's digest. VERSION is the newest version tag merged into the commit
# and the commits since, such as v0.11.0-rc.3-dev.2 (tools/versions.sh).
# Dev builds are untested beyond Check and are for Linux only.
name: Dev

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dev:
    # Only a passed Check of a push to this repository's main; a pull
    # request from a fork's branch called main does not count.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A newer build replaces an older one still running.
    concurrency:
      group: dev
      cancel-in-progress: true
    permissions:
      contents: write # the release dev and its tag
      packages: write # publishing the image and removing old dev images
    env:
      # The commit Check tested, not whatever main is now.
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0 # the version needs the tags and the history
          persist-credentials: false

      # A rerun of an older build must not replace a newer one: the tag dev
      # marks the commit the release dev holds.
      - name: Name the build
        id: version
        run: |
          git merge-base --is-ancestor "$COMMIT" origin/main || {
            echo "::error::${COMMIT:0:12} is not on main"
            exit 1
          }
          current=$(git rev-parse --quiet --verify 'refs/tags/dev^{commit}' || true)
          if [ -n "$current" ] && [ "$current" != "$COMMIT" ] && git merge-base --is-ancestor "$COMMIT" "$current"; then
            echo "::error::the release dev holds ${current:0:12}, which is newer than ${COMMIT:0:12}; nothing was replaced"
            exit 1
          fi
          source tools/versions.sh
          version=$(dev_version "$COMMIT") || {
            echo "::error::no version tag is merged into ${COMMIT:0:12}"
            exit 1
          }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Building $version from ${COMMIT:0:12}" >>"$GITHUB_STEP_SUMMARY"

      - name: Check that the TheTVDB key is set
        env:
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: |
          [ -n "$TVDB_API_KEY" ] || {
            echo "::error::the repository secret TVDB_API_KEY is missing"
            exit 1
          }

      - name: Read the tool versions from mise.toml
        id: tools
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "goreleaser=$(sed -n 's/^goreleaser = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false

      # The same source archive a release has; the image is built from it,
      # and the release dev publishes it.
      - name: Build the source archive
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash tools/source.sh "$VERSION" "$RUNNER_TEMP/source"
          {
            echo "archive=$RUNNER_TEMP/source/garner-$VERSION-source.tar.gz"
            echo "context=$RUNNER_TEMP/source/garner-$VERSION-source/garner"
            echo "url=https://github.com/$GH_REPO/releases/download/dev/garner-$VERSION-source.tar.gz"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Built as a release builds it, with VERSION in garnerd and in the
      # image's version label. The Actions cache is shared by every dev
      # build on main, so FFprobe is built again only when it changes. The
      # image stays on the runner until its source archive is published.
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.source.outputs.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ env.COMMIT }}
            SOURCE_URL=${{ steps.source.outputs.url }}
          secrets: |
            tvdb_api_key=${{ secrets.TVDB_API_KEY }}
          cache-from: type=gha,scope=garner-dev
          cache-to: type=gha,scope=garner-dev,mode=max
          provenance: false
          sbom: false

      # A snapshot with the release's archives, named by the dev version
      # and naming the source archive in the release dev. It builds the
      # macOS archives too, unsigned; they are not published.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v${{ steps.tools.outputs.goreleaser }}
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
          SOURCE_URL: ${{ steps.source.outputs.url }}

      # The new files go up before SHA256SUMS, which names them, so the
      # sums never name a file that is missing. The old build's files stay
      # until the release names the new build.
      - name: Upload the files to the release dev
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          files=("$SOURCE_ARCHIVE" "dist/garner-$VERSION-linux-amd64.tar.gz" "dist/garner-$VERSION-linux-arm64.tar.gz")
          : >"$RUNNER_TEMP/SHA256SUMS"
          for file in "${files[@]}"; do
            awk -v f="${file##*/}" '$2 == f { print; found = 1 } END { exit !found }' dist/SHA256SUMS >>"$RUNNER_TEMP/SHA256SUMS" || {
              echo "::error::GoReleaser's SHA256SUMS lists no ${file##*/}"
              exit 1
            }
          done
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --target "$COMMIT" --title "$VERSION" \
              --notes "The first dev build is being published."
          fi
          gh release upload dev "${files[@]}" --clobber
          gh release upload dev "$RUNNER_TEMP/SHA256SUMS" --clobber

      - name: Push the server image
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push --quiet "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::no digest for $IMAGE:$VERSION: $digest"
            exit 1
          }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          # Tagged again, not built again, and copied as it is.
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:dev" "$IMAGE@$digest"

      # The title is the version and the body names the image by digest,
      # as a release does; `homelab upgrade garner dev` reads both. Then
      # the old build's files go.
      - name: Name the build in the release dev
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh api --silent --method PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$COMMIT" -F force=true
          # shellcheck disable=SC2016 # the backticks are Markdown
          printf 'Server image: `%s`\n\nAn untested build of main at commit %s.\n' "$IMAGE:$VERSION@$DIGEST" "$COMMIT" >"$RUNNER_TEMP/body.md"
          gh release edit dev --prerelease --title "$VERSION" --notes-file "$RUNNER_TEMP/body.md"
          keep=" SHA256SUMS garner-$VERSION-source.tar.gz garner-$VERSION-linux-amd64.tar.gz garner-$VERSION-linux-arm64.tar.gz "
          gh release view dev --json assets --jq '.assets[].name' | while read -r name; do
            [[ "$keep" == *" $name "* ]] || gh release delete-asset dev "$name" --yes
          done
          echo "Published $VERSION: $IMAGE:$VERSION@$DIGEST" >>"$GITHUB_STEP_SUMMARY"

      # Keeps the 20 newest dev images: the one tagged dev and 19 before
      # it. Only images tagged with nothing but dev versions count, so a
      # release's image is never removed here (tools/versions.sh,
      # old_images). The build is out by now, so a failure here must not
      # fail it.
      - name: Remove old dev images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          source tools/versions.sh
          gh api --paginate "users/$OWNER/packages/container/garner/versions" \
            --jq '.[] | [.id, .created_at, (.metadata.container.tags | join(","))] | @tsv' |
            old_images dev 19 |
            while read -r id; do
              gh api --silent --method DELETE "users/$OWNER/packages/container/garner/versions/$id"
            done
