# Builds a release when `mise run release vX.Y.Z` pushes its tag: the server
# image on ghcr.io, then, with GoReleaser, the terminal interface for macOS
# and Linux and the GitHub release. The tag's commit passed
# `mise run check` before it was pushed, so nothing is tested here.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time; one pushed meanwhile waits for its turn.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-24.04
    # The image takes a few minutes, notarizing each macOS binary up to 20.
    timeout-minutes: 75
    permissions:
      contents: write # the GitHub release
      packages: write # the image and its build cache, and removing old ones
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]] || {
            echo "::error::$TAG is not a version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser's notes need the previous tag
          persist-credentials: false

      # mise run release tags only commits on main; a tag pushed some other
      # way must at least be on main.
      - name: Check that the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG is not on main; release with mise run release"
            exit 1
          }

      # Every release builds garner's TheTVDB key into the server, so users
      # need none of their own.
      - name: Check that the TheTVDB key is set
        env:
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: |
          [ -n "$TVDB_API_KEY" ] || {
            echo "::error::the repository secret TVDB_API_KEY is missing"
            exit 1
          }

      # Without them, GoReleaser would leave the macOS binaries unsigned and
      # the Homebrew cask out of date.
      - name: Check that the signing and Homebrew secrets are set
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID HOMEBREW_TAP_KEY; do
            [ -n "${!name}" ] || {
              echo "::error::the repository secret $name is missing"
              exit 1
            }
          done

      # The channels: latest names the newest stable release on main, which
      # the Compose example pulls, and dev the newest version of all,
      # candidates included. Only they move the Homebrew casks garner and
      # garner@dev and GitHub's latest release; a rerun of an older release
      # leaves them alone. The image tags move once the release is out.
      - name: Choose the channels
        id: tags
        run: |
          source tools/versions.sh
          versions=$(git tag --merged origin/main | sort_versions)
          newest=$(printf '%s\n' "$versions" | tail -1)
          stable=$(printf '%s\n' "$versions" | grep -E "$STABLE_PATTERN" | tail -1 || true)
          channels=""
          [ "$stable" != "$TAG" ] || channels="$channels latest"
          [ "$newest" != "$TAG" ] || channels="$channels dev"
          {
            echo "channels=${channels# }"
            echo "newest=$([ "$newest" = "$TAG" ] && echo true || echo false)"
            echo "newest_stable=$([ "$stable" = "$TAG" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Read the tool versions from mise.toml
        id: tools
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "goreleaser=$(sed -n 's/^goreleaser = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The build cache lives on ghcr.io, so FFprobe is compiled only when
      # the Dockerfile's FFmpeg changes; GitHub's own cache expires after a
      # week without use. One image, no attestations, so the digest names
      # exactly what a server runs.
      - name: Build and push the server image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
          secrets: |
            tvdb_api_key=${{ secrets.TVDB_API_KEY }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false
          sbom: false

      # The notes list the commits that change garner itself and what to
      # know before upgrading, the tag's note included. The tag is fetched
      # again because a checkout may keep it without its message. Should the
      # notes fail, GoReleaser lists every commit instead of failing the
      # release.
      - name: Write the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          if bash tools/release-notes.sh "$TAG" >"$RUNNER_TEMP/notes.md"; then
            echo "args=--release-notes=$RUNNER_TEMP/notes.md" >>"$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/notes.md" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not write the release notes; GoReleaser lists every commit instead"
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v${{ steps.tools.outputs.goreleaser }}
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Stable and its candidate share a commit; do not let tag sorting pick the candidate.
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.TAG }}@${{ steps.image.outputs.digest }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
          NEWEST_RELEASE: ${{ steps.tags.outputs.newest }}
          NEWEST_STABLE: ${{ steps.tags.outputs.newest_stable }}

      # Only now, with the release out, do the channels' image tags point to
      # this image, so a failed release leaves them where they were. The
      # image is tagged again, not built again, and copied as it is: by
      # default imagetools wraps it in an index with a digest of its own.
      - name: Move the channels' image tags
        if: steps.tags.outputs.channels != ''
        env:
          CHANNELS: ${{ steps.tags.outputs.channels }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          args=()
          for channel in $CHANNELS; do
            args+=(--tag "$IMAGE:$channel")
          done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$DIGEST"

      # The container registry is free for now; keeping twenty versions
      # (images and their build cache) stays small if that changes. The
      # release is out by now, so a failure here must not fail it.
      - name: Remove old images
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: garner
          package-type: container
          min-versions-to-keep: 20
